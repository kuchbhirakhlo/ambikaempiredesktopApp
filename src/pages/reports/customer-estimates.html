<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Comparison Chart</title>
  <link rel="stylesheet" href="../../components/Navbar.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eaeaea;
    }

    header h1 {
      color: #333;
      margin: 0;
      font-size: 24px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: #4a6cf7;
      color: white;
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid #4a6cf7;
      color: #4a6cf7;
    }

    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      color: #4a6cf7;
      margin-bottom: 20px;
    }

    .report-table-container {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
    }

    .report-table th {
      background-color: #f5f5f5;
      padding: 12px 15px;
      text-align: left;
      font-weight: 600;
      color: #333;
      border-bottom: 1px solid #eaeaea;
    }

    .report-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #eaeaea;
    }

    .report-filters {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 0;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
      font-size: 14px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .summary-card {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .summary-card h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #666;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 600;
      color: #4a6cf7;
    }

    .chart-container {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
      height: 400px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      font-size: 16px;
      color: #666;
    }

    .no-data {
      text-align: center;
      padding: 30px;
      font-size: 16px;
      color: #666;
      font-style: italic;
    }
  </style>
</head>

<body>
  <div class="app-container">
    <!-- Navbar container -->
    <div id="navbar-container"></div>

    <!-- Main content -->
    <div class="main-content">
      <div class="container">
        <a href="../reports.html" class="back-link">← Back to Reports</a>

        <header>
          <h1>Order Comparison Chart</h1>
          <div class="header-actions">
            <button id="refresh-btn" class="btn btn-secondary">Refresh Data</button>
            <button id="export-pdf-btn" class="btn btn-outline">Export PDF</button>
            <button id="export-excel-btn" class="btn btn-primary">Export Excel</button>
          </div>
        </header>

        <!-- Report Table -->
        <div class="report-table-container">
          <table class="report-table">
            <thead>
              <tr>
                <th>Product Code</th>
                <th>Product Name</th>
                <th>Price (₹)</th>
                <th>Purchased Qty (All Time)</th>
                <th>Sold Qty (from Sales)</th>
                <th>In Stock Qty</th>
              </tr>
            </thead>
            <tbody id="inventory-table">
              <tr>
                <td colspan="6" class="loading">Loading data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="../../components/Navbar.js"></script>
  <script>
    // Check if user is logged in
    const userString = sessionStorage.getItem('user');
    if (!userString) {
      window.location.href = '../login.html';
    }

    // Ensure the active year is set in the database before making API calls
    async function initializeYear() {
      const selectedYear = parseInt(sessionStorage.getItem('selectedYear') || new Date().getFullYear(), 10);
      if (window.api && window.api.setActiveYear) {
        await window.api.setActiveYear(selectedYear);
      }
      return selectedYear;
    }

    let productList = [];
    let refreshIntervalId = null;

    // Initialize year before building the list
    async function buildProductList() {
      await initializeYear();
      
      const [products, inventory, transactions] = await Promise.all([
        window.api.getProducts(),
        window.api.getInventory(),
        window.api.getTransactions()
      ]);

      const byCode = {};
      const idToKey = {};

      // First, add all products to ensure we have all product codes
      products.forEach(item => {
        const code = (item.code || item.productCode || '').toString().trim();
        const id = item.productId != null ? item.productId : item.id;
        const key = code || 'id_' + id;
        if (id != null) idToKey[id] = key;
        byCode[key] = {
          code: item.code || item.productCode || '-',
          name: item.name || '-',
          price: parseFloat(item.price) || 0,
          purchased: 0,
          sold: 0,
          inStock: 0
        };
      });

      // Process inventory data for live in-stock quantity
      inventory.forEach(item => {
        const code = (item.code || item.productCode || '').toString().trim();
        const id = item.productId != null ? item.productId : item.id;
        const key = code || 'id_' + id;
        if (id != null) idToKey[id] = key;
        if (!byCode[key]) {
          byCode[key] = {
            code: item.code || item.productCode || '-',
            name: item.name || '-',
            price: parseFloat(item.price) || 0,
            purchased: 0,
            sold: 0,
            inStock: 0
          };
        }
        // Set inStock from inventory quantity
        byCode[key].inStock = parseInt(item.quantity, 10) || 0;
      });

      // Process inventory transactions to get Purchased Qty (All Time) from inventory page updates.
      // Description format is: "Product quantity updated from X to Y".
      // Count only positive increases (Y - X) as purchased quantity.
      transactions.forEach(t => {
        if (t.transaction_type !== 'inventory') return;
        const pid = t.related_id != null ? t.related_id : t.productId;
        const key = idToKey[pid] || (pid != null ? 'id_' + pid : null);
        const row = key ? byCode[key] : null;
        if (!row) return;

        const desc = (t.description || '').toString();
        const match = desc.match(/from\s+(-?\d+)\s+to\s+(-?\d+)/i);
        if (!match) return;

        const oldQty = parseInt(match[1], 10) || 0;
        const newQty = parseInt(match[2], 10) || 0;
        const delta = newQty - oldQty;
        if (delta > 0) row.purchased += delta;
      });

      // Process inventory transactions for Sold Qty (from Sales).
      // Sales flow decreases inventory, so count negative deltas as sold quantity.
      transactions.forEach(t => {
        if (t.transaction_type !== 'inventory') return;
        const pid = t.related_id != null ? t.related_id : t.productId;
        const key = idToKey[pid] || (pid != null ? 'id_' + pid : null);
        const row = key ? byCode[key] : null;
        if (!row) return;

        const desc = (t.description || '').toString();
        const match = desc.match(/from\s+(-?\d+)\s+to\s+(-?\d+)/i);
        if (!match) return;

        const oldQty = parseInt(match[1], 10) || 0;
        const newQty = parseInt(match[2], 10) || 0;
        const delta = newQty - oldQty;
        if (delta < 0) row.sold += Math.abs(delta);
      });

      // Convert to array and sort by Product Code in ascending order (numeric)
      productList = Object.values(byCode).sort((a, b) => {
        // Extract numeric part from product code (e.g., "5601" from "5601" or "P001")
        const aNum = parseInt(a.code.replace(/\D/g, '')) || 0;
        const bNum = parseInt(b.code.replace(/\D/g, '')) || 0;
        return aNum - bNum;
      });
    }

    async function loadData() {
      try {
        await buildProductList();
        renderTable();
        return true;
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('inventory-table').innerHTML = `
          <tr>
            <td colspan="6" class="no-data">Error loading data. Please try again.</td>
          </tr>
        `;
        return false;
      }
    }

    function renderTable() {
      const tableBody = document.getElementById('inventory-table');
      tableBody.innerHTML = '';

      if (productList.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="6" class="no-data">No product data found.</td>
          </tr>
        `;
        return;
      }

      productList.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.code}</td>
          <td>${row.name}</td>
          <td>${row.price ? '₹' + row.price.toFixed(2) : '—'}</td>
          <td>${row.purchased}</td>
          <td>${row.sold}</td>
          <td>${row.inStock}</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Ensure the active year is set before loading data
      initializeYear().then(() => {
        loadData();
      });
      
      document.getElementById('refresh-btn').addEventListener('click', () => {
        document.getElementById('inventory-table').innerHTML = `
          <tr>
            <td colspan="6" class="loading">Refreshing data...</td>
          </tr>
        `;
        setTimeout(() => {
          loadData();
        }, 300);
      });

      // Keep report close to real-time by polling DB periodically.
      refreshIntervalId = setInterval(() => {
        loadData();
      }, 5000);
    });

    window.addEventListener('beforeunload', () => {
      if (refreshIntervalId) {
        clearInterval(refreshIntervalId);
      }
    });

    window.addEventListener('storage', (event) => {
      if ([
        'inventory',
        'transactions',
        'estimates',
        'products',
        'inventory-update-timestamp',
        'inventory-force-refresh',
        'inventory-trigger-refresh'
      ].includes(event.key)) {
        loadData();
      }
    });

    // Export handlers
    document.getElementById('export-pdf-btn').addEventListener('click', () => {
      exportToPDF();
    });

    document.getElementById('export-excel-btn').addEventListener('click', () => {
      exportToExcel();
    });

    // Function to export data to PDF
    function exportToPDF() {
      // Check if jsPDF is available
      if (typeof window.jspdf === 'undefined') {
        // Load jsPDF dynamically
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
        script.onload = () => {
          const { jsPDF } = window.jspdf;
          generatePDF(jsPDF);
        };
        document.head.appendChild(script);
      } else {
        const { jsPDF } = window.jspdf;
        generatePDF(jsPDF);
      }
    }

    function generatePDF(jsPDF) {
      const doc = new jsPDF();

      // Add title
      doc.setFontSize(18);
      doc.text('Order Comparison Chart', 14, 22);

      // Add date
      doc.setFontSize(11);
      doc.text(`Generated on: ${new Date().toLocaleDateString()}`, 14, 30);

      // Create table data
      const tableData = productList.map(row => [
        row.code,
        row.name,
        row.price ? '₹' + row.price.toFixed(2) : '-',
        row.purchased.toString(),
        row.sold.toString(),
        row.inStock.toString()
      ]);

      // Define table columns
      const columns = [
        { header: 'Product Code', dataKey: 'code' },
        { header: 'Product Name', dataKey: 'name' },
        { header: 'Price (₹)', dataKey: 'price' },
        { header: 'Purchased Qty', dataKey: 'purchased' },
        { header: 'Sold Qty', dataKey: 'sold' },
        { header: 'In Stock Qty', dataKey: 'inStock' }
      ];

      // Create the table
      doc.autoTable({
        startY: 40,
        head: [columns.map(col => col.header)],
        body: tableData,
        theme: 'grid',
        headStyles: {
          fillColor: [74, 108, 247],
          textColor: [255, 255, 255],
          fontStyle: 'bold'
        },
        alternateRowStyles: {
          fillColor: [240, 244, 255]
        }
      });

      // Save the PDF
      doc.save('order_comparison_chart.pdf');
    }

    // Function to export data to Excel
    function exportToExcel() {
      // Create CSV content
      let csvContent = '\uFEFF'; // BOM for UTF-8

      // Add header row
      csvContent += 'Product Code,Product Name,Price (₹),Purchased Qty (All Time),Sold Qty (from Sales),In Stock Qty\n';

      // Add data rows
      productList.forEach(row => {
        const rowData = [
          row.code,
          '"' + (row.name || '').replace(/"/g, '""') + '"',
          row.price || '',
          row.purchased,
          row.sold,
          row.inStock
        ];
        csvContent += rowData.join(',') + '\n';
      });

      // Create blob and download
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);

      link.setAttribute('href', url);
      link.setAttribute('download', 'order_comparison_chart.csv');
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>

</html>
