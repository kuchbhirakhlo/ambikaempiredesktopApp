<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Comparison Chart</title>
  <link rel="stylesheet" href="../../components/Navbar.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eaeaea;
    }
    header h1 {
      color: #333;
      margin: 0;
      font-size: 24px;
    }
    .header-actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }
    .btn-primary {
      background-color: #4a6cf7;
      color: white;
    }
    .btn-outline {
      background-color: transparent;
      border: 1px solid #4a6cf7;
      color: #4a6cf7;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      color: #4a6cf7;
      margin-bottom: 20px;
    }
    .report-table-container {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    .report-table {
      width: 100%;
      border-collapse: collapse;
    }
    .report-table th {
      background-color: #f5f5f5;
      padding: 12px 15px;
      text-align: left;
      font-weight: 600;
      color: #333;
      border-bottom: 1px solid #eaeaea;
    }
    .report-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #eaeaea;
    }
    .report-filters {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    .form-group {
      margin-bottom: 0;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
      font-size: 14px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .summary-card {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .summary-card h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #666;
    }
    .summary-value {
      font-size: 24px;
      font-weight: 600;
      color: #4a6cf7;
    }
    .chart-container {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
      height: 400px;
    }
    .loading {
      text-align: center;
      padding: 20px;
      font-size: 16px;
      color: #666;
    }
    .no-data {
      text-align: center;
      padding: 30px;
      font-size: 16px;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Navbar container -->
    <div id="navbar-container"></div>
    
    <!-- Main content -->
    <div class="main-content">
      <div class="container">
        <a href="../reports.html" class="back-link">← Back to Reports</a>
        
        <header>
          <h1>Order Comparison Chart</h1>
          <div class="header-actions">
            <button id="refresh-btn" class="btn btn-secondary">Refresh Data</button>
            <button id="export-pdf-btn" class="btn btn-outline">Export PDF</button>
            <button id="export-excel-btn" class="btn btn-primary">Export Excel</button>
          </div>
        </header>

        <!-- Report Table -->
        <div class="report-table-container">
          <table class="report-table">
            <thead>
              <tr>
                <th>Product Code</th>
                <th>Product Name</th>
                <th>Price (₹)</th>
                <th>Purchased Qty (All Time)</th>
                <th>Sold Qty (from Sales)</th>
                <th>In Stock Qty</th>
              </tr>
            </thead>
            <tbody id="inventory-table">
              <tr>
                <td colspan="6" class="loading">Loading data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="../../components/Navbar.js"></script>
  <script>
    // Check if user is logged in
    const userString = sessionStorage.getItem('user');
    if (!userString) {
      window.location.href = '../login.html';
    }

    let productList = [];

    // Build list: Product Code, Product Name, Price, Purchased Qty (inventory/transactions), Sold Qty (estimates), In Stock (inventory)
    function buildProductList() {
      const inventory = JSON.parse(localStorage.getItem('inventory') || '[]');
      const transactions = JSON.parse(localStorage.getItem('transactions') || '[]');
      const estimates = JSON.parse(localStorage.getItem('estimates') || '[]');

      const byCode = {};
      const idToKey = {};
      inventory.forEach(item => {
        const code = (item.code || item.productCode || '').toString().trim();
        const id = item.productId != null ? item.productId : item.id;
        const key = code || 'id_' + id;
        if (id != null) idToKey[id] = key;
        byCode[key] = {
          code: item.code || item.productCode || '-',
          name: item.name || '-',
          price: parseFloat(item.price) || 0,
          purchased: 0,
          sold: 0,
          inStock: parseInt(item.quantity, 10) || 0
        };
      });

      transactions.forEach(t => {
        const pid = t.productId != null ? t.productId : t.productId;
        const key = idToKey[pid] || (pid != null ? 'id_' + pid : null);
        const row = key ? byCode[key] : null;
        if (!row) return;
        const qty = parseInt(t.quantity, 10) || 0;
        if (qty > 0) row.purchased += qty;
      });

      estimates.forEach(est => {
        const items = est.items || [];
        items.forEach(item => {
          const code = (item.productCode || item.code || '').toString().trim();
          if (!code) return;
          if (!byCode[code]) {
            byCode[code] = {
              code: code,
              name: item.name || '-',
              price: parseFloat(item.rate || item.price) || 0,
              purchased: 0,
              sold: 0,
              inStock: 0
            };
          }
          byCode[code].sold += parseInt(item.quantity, 10) || 0;
        });
      });

      productList = Object.values(byCode).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    }

    function loadData() {
      try {
        buildProductList();
        renderTable();
        return true;
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('inventory-table').innerHTML = `
          <tr>
            <td colspan="6" class="no-data">Error loading data. Please try again.</td>
          </tr>
        `;
        return false;
      }
    }

    function renderTable() {
      const tableBody = document.getElementById('inventory-table');
      tableBody.innerHTML = '';

      if (productList.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="6" class="no-data">No product data found.</td>
          </tr>
        `;
        return;
      }

      productList.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.code}</td>
          <td>${row.name}</td>
          <td>${row.price ? '₹' + row.price.toFixed(2) : '—'}</td>
          <td>${row.purchased}</td>
          <td>${row.sold}</td>
          <td>${row.inStock}</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadData();
      document.getElementById('refresh-btn').addEventListener('click', () => {
        document.getElementById('inventory-table').innerHTML = `
          <tr>
            <td colspan="6" class="loading">Refreshing data...</td>
          </tr>
        `;
        setTimeout(loadData, 300);
      });
    });

    window.addEventListener('storage', (event) => {
      if (['inventory', 'transactions', 'estimates', 'products'].includes(event.key)) {
        loadData();
      }
    });

    // Export handlers
    document.getElementById('export-pdf-btn').addEventListener('click', () => {
      alert('PDF export functionality would be implemented here');
    });

    document.getElementById('export-excel-btn').addEventListener('click', () => {
      alert('Excel export functionality would be implemented here');
    });
  </script>
</body>
</html>
