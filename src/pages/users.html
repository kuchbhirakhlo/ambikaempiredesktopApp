<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Management - User Management</title>
  <link rel="stylesheet" href="../components/Navbar.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eaeaea;
    }
    header h1 {
      color: #333;
      margin: 0;
      font-size: 24px;
    }
    .header-actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }
    .btn-primary {
      background-color: #4a6cf7;
      color: white;
    }
    .btn-primary:hover {
      background-color: #3a5bd9;
    }
    .btn-outline {
      background-color: transparent;
      border: 1px solid #4a6cf7;
      color: #4a6cf7;
    }
    .btn-outline:hover {
      background-color: #f0f4ff;
    }
    .page-content {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }
    .data-table th {
      background-color: #f9f9f9;
      text-align: left;
      padding: 12px 15px;
      font-weight: 600;
      color: #333;
      border-bottom: 1px solid #eaeaea;
    }
    .data-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #eaeaea;
    }
    .data-table tr:last-child td {
      border-bottom: none;
    }
    .data-table tr:hover {
      background-color: #f5f9ff;
    }
    .role-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }
    .role-admin {
      background-color: #e3f2fd;
      color: #1976d2;
    }
    .role-employee {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .role-active {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .role-blocked {
      background-color: #ffebee;
      color: #c62828;
    }
    .action-cell {
      display: flex;
      gap: 8px;
    }
    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      align-items: center;
    }
    .filter-bar input, .filter-bar select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      width: 500px;
      max-width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #666;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
    .password-toggle {
      position: relative;
    }
    .password-toggle button {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 14px;
    }
    .access-denied {
      text-align: center;
      padding: 50px 0;
    }
    .access-denied h2 {
      color: #d32f2f;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Navbar container -->
    <div id="navbar-container"></div>
    
    <!-- Main content -->
    <div class="main-content">
      <div class="container">
        <header>
          <h1>User Management</h1>
          <div id="admin-actions" class="header-actions" style="display: none;">
            <button id="add-user-btn" class="btn btn-primary">Add New User</button>
          </div>
        </header>
        
        <div id="admin-content" class="page-content" style="display: none;">
          <div class="filter-bar">
            <input type="text" id="search-input" placeholder="Search users...">
            <select id="role-filter">
              <option value="">All Roles</option>
              <option value="admin">Admin</option>
              <option value="employee">Employee</option>
            </select>
            <select id="status-filter">
              <option value="">All Status</option>
              <option value="active">Active</option>
              <option value="blocked">Blocked</option>
            </select>
          </div>
          
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <!-- User data will be loaded here -->
            </tbody>
          </table>
        </div>
        
        <div id="employee-content" class="page-content" style="display: none;">
          <div class="access-denied">
            <h2>Access Restricted</h2>
            <p>Only administrators can manage user accounts.</p>
            <div style="margin-top: 20px;">
              <p>You are currently logged in as an employee.</p>
              <p>Please navigate to one of the following pages:</p>
              <div style="display: flex; justify-content: center; gap: 10px; margin-top: 15px;">
                <a href="dashboard.html" class="btn btn-outline">Dashboard</a>
                <a href="sales.html" class="btn btn-outline">Sales</a>
                <a href="inventory.html" class="btn btn-outline">Inventory</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Add/Edit User Modal -->
  <div id="user-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Add New User</h2>
        <button class="close-btn">&times;</button>
      </div>
      <form id="user-form">
        <div class="form-group">
          <label for="user-name">Full Name</label>
          <input type="text" id="user-name" required>
        </div>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label for="user-email">Email</label>
          <input type="email" id="user-email" required>
        </div>
        <div class="form-group password-toggle">
          <label for="user-password">Password</label>
          <input type="password" id="user-password" required>
          <button type="button" id="toggle-password">Show</button>
        </div>
        <div class="form-group">
          <label for="user-role">Role</label>
          <select id="user-role" required>
            <option value="">Select Role</option>
            <option value="admin">Administrator</option>
            <option value="employee">Employee</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save User</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../components/Navbar.js"></script>
  <script src="../utils/error-recovery.js"></script>
  <script>
    // Browser compatibility layer for window.api
    if (!window.api) {
      console.log('Running in browser mode - using localStorage API fallback');
      
      // Global error handler for API operations
      function handleApiError(operation, error) {
        console.error(`Error during ${operation}:`, error);
        alert(`An error occurred while ${operation}. Error: ${error.message || error}`);
        
        // Ensure the UI remains responsive by removing any potential event listeners
        // that might be blocking input fields
        setTimeout(() => {
          const inputFields = document.querySelectorAll('input, select, textarea');
          inputFields.forEach(field => {
            // Clone and replace the element to remove any stuck event handlers
            const newField = field.cloneNode(true);
            if (field.value) newField.value = field.value;
            field.parentNode.replaceChild(newField, field);
          });
        }, 100);
      }
      
      window.api = {
        getUsers: async () => {
          try {
            const usersJson = localStorage.getItem('users');
            if (!usersJson) return [];
            return JSON.parse(usersJson);
          } catch (error) {
            handleApiError('getting users', error);
            return [];
          }
        },
        addUser: async (userData) => {
          try {
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            
            // Generate new ID
            userData.id = users.length > 0 
              ? Math.max(...users.map(u => typeof u.id === 'number' ? u.id : 0)) + 1 
              : 1;
            
            // Ensure status is set
            userData.status = userData.status || 'active';
            
            // Add to users array
            users.push(userData);
            
            // Save to localStorage
            localStorage.setItem('users', JSON.stringify(users));
            
            return { success: true };
          } catch (error) {
            handleApiError('adding user', error);
            throw new Error('Failed to add user');
          }
        },
        updateUser: async (userId, userData) => {
          try {
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const index = users.findIndex(u => u.id === userId);
            
            if (index !== -1) {
              // Preserve user id
              userData.id = userId;
              
              // Preserve password if not provided
              if (!userData.password && users[index].password) {
                userData.password = users[index].password;
              }
              
              // Update user
              users[index] = userData;
              
              // Save to localStorage
              localStorage.setItem('users', JSON.stringify(users));
              
              return { success: true };
            } else {
              throw new Error('User not found');
            }
          } catch (error) {
            handleApiError('updating user', error);
            throw new Error('Failed to update user');
          }
        },
        deleteUser: async (userId) => {
          try {
            let users = JSON.parse(localStorage.getItem('users') || '[]');
            users = users.filter(u => u.id !== userId);
            localStorage.setItem('users', JSON.stringify(users));
            return { success: true };
          } catch (error) {
            handleApiError('deleting user', error);
            throw new Error('Failed to delete user');
          }
        }
      };
      
      // Initialize with sample users if none exist
      const existingUsers = JSON.parse(localStorage.getItem('users') || '[]');
      if (existingUsers.length === 0) {
        console.log('Creating default users...');
        
        const defaultAdmin = {
          id: 1,
          name: 'Admin User',
          username: 'admin',
          password: 'admin123',
          email: 'admin@example.com',
          role: 'admin',
          status: 'active'
        };
        
        const defaultEmployee = {
          id: 2,
          name: 'Employee User',
          username: 'employee',
          password: 'employee123',
          email: 'employee@example.com',
          role: 'employee',
          status: 'active'
        };
        
        localStorage.setItem('users', JSON.stringify([defaultAdmin, defaultEmployee]));
        console.log('Default users created successfully');
      } else {
        // Ensure an admin user exists
        const adminExists = existingUsers.some(u => u.role === 'admin');
        
        if (!adminExists) {
          console.log('No admin user found. Creating default admin...');
          
          const defaultAdmin = {
            id: existingUsers.length > 0 
              ? Math.max(...existingUsers.map(u => typeof u.id === 'number' ? u.id : 0)) + 1 
              : 1,
            name: 'Admin User',
            username: 'admin',
            password: 'admin123',
            email: 'admin@example.com',
            role: 'admin',
            status: 'active'
          };
          
          existingUsers.push(defaultAdmin);
          localStorage.setItem('users', JSON.stringify(existingUsers));
          console.log('Default admin user created successfully');
        }
      }
    }
    
    // Check if user is logged in
    const userString = sessionStorage.getItem('user');
    if (!userString) {
      window.location.href = 'login.html';
    }
    
    const user = JSON.parse(userString);
    const isAdmin = user.role === 'admin';
    let currentUserId = null;
    let users = [];
    
    // Show appropriate content based on user role
    if (isAdmin) {
      document.getElementById('admin-content').style.display = 'block';
      document.getElementById('admin-actions').style.display = 'flex';
    } else {
      document.getElementById('employee-content').style.display = 'block';
    }
    
    // Fetch users - both admins and employees can see the list, but only admins can edit
    async function loadUsers() {
      try {
        if (window.api && window.api.getUsers) {
          users = await window.api.getUsers();
        } else {
          // Fallback to localStorage for browser testing
          users = JSON.parse(localStorage.getItem('users') || '[]');
        }
        
        if (isAdmin) {
          renderUsers();
        }
      } catch (error) {
        console.error('Error loading users:', error);
        alert('Error loading users. Please try again.');
        
        // Ensure the UI remains responsive
        recoverFormInputs();
      }
    }
    
    // Render users table
    function renderUsers(usersList = users) {
      if (!isAdmin) return;
      
      const tableBody = document.getElementById('users-table-body');
      tableBody.innerHTML = '';
      
      usersList.forEach(userData => {
        // Skip rendering the current user
        if (userData.id === user.id) return;
        
        // Set default status to active if not defined
        if (!userData.status) userData.status = 'active';
        
        // Determine block button text based on current status
        const blockBtnText = userData.status === 'blocked' ? 'Unblock' : 'Block';
        const blockBtnClass = userData.status === 'blocked' ? 'btn-outline' : 'btn-outline block-btn';
        
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${userData.id}</td>
          <td>${userData.name || '-'}</td>
          <td>${userData.username}</td>
          <td>${userData.email || '-'}</td>
          <td><span class="role-badge role-${userData.role}">${userData.role}</span></td>
          <td><span class="role-badge role-${userData.status}">${userData.status}</span></td>
          <td class="action-cell">
            <button class="btn btn-outline edit-btn" data-id="${userData.id}">Edit</button>
            <button class="btn ${blockBtnClass}" data-id="${userData.id}" data-status="${userData.status}">${blockBtnText}</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
      
      // Add event listeners to buttons
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', handleEditUser);
      });
      
      document.querySelectorAll('.block-btn, [data-status="blocked"]').forEach(btn => {
        btn.addEventListener('click', handleToggleBlockUser);
      });
    }
    
    // Filter users based on search input and role
    function filterUsers() {
      if (!isAdmin) return;
      
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const roleFilter = document.getElementById('role-filter').value;
      const statusFilter = document.getElementById('status-filter').value;
      
      const filteredUsers = users.filter(userData => {
        const matchesSearch = 
          (userData.name && userData.name.toLowerCase().includes(searchTerm)) || 
          userData.username.toLowerCase().includes(searchTerm) ||
          (userData.email && userData.email.toLowerCase().includes(searchTerm));
        
        const matchesRole = roleFilter === '' || userData.role === roleFilter;
        const matchesStatus = statusFilter === '' || userData.status === statusFilter;
        
        return matchesSearch && matchesRole && matchesStatus;
      });
      
      renderUsers(filteredUsers);
    }
    
    // Handle edit button click
    function handleEditUser(e) {
      const userId = parseInt(e.target.dataset.id);
      currentUserId = userId;
      
      const userData = users.find(u => u.id === userId);
      if (userData) {
        document.getElementById('modal-title').textContent = 'Edit User';
        document.getElementById('user-name').value = userData.name || '';
        document.getElementById('username').value = userData.username;
        document.getElementById('user-email').value = userData.email || '';
        document.getElementById('user-password').value = ''; // Don't populate password
        document.getElementById('user-role').value = userData.role;
        
        document.getElementById('user-modal').style.display = 'flex';
      }
    }
    
    // Handle delete button click
    async function handleDeleteUser(e) {
      const userId = parseInt(e.target.dataset.id);
      
      // Don't allow deleting the current user
      if (userId === user.id) {
        alert('You cannot delete your own account.');
        return;
      }
      
      if (confirm('Are you sure you want to delete this user? This action cannot be undone.')) {
        try {
          await window.api.deleteUser(userId);
          loadUsers(); // Refresh the user list
        } catch (error) {
          console.error('Error deleting user:', error);
          alert('Failed to delete user. Please try again.');
        }
      }
    }
    
    // Handle block/unblock button click
    async function handleToggleBlockUser(e) {
      const userId = parseInt(e.target.dataset.id);
      const currentStatus = e.target.dataset.status;
      
      // Don't allow blocking the current user (yourself)
      if (userId === user.id) {
        alert('You cannot block your own account.');
        return;
      }
      
      const newStatus = currentStatus === 'blocked' ? 'active' : 'blocked';
      const action = newStatus === 'blocked' ? 'block' : 'unblock';
      
      if (confirm(`Are you sure you want to ${action} this user?`)) {
        try {
          // Get the latest user data
          const allUsers = await window.api.getUsers();
          const userData = allUsers.find(u => u.id === userId);
          
          if (userData) {
            // Update the status
            userData.status = newStatus;
            
            // Save the updated user
            await window.api.updateUser(userId, userData);
            
            // Show success message
            alert(`User ${action}ed successfully.`);
            
            // Refresh the user list
            loadUsers();
          } else {
            alert('User not found. Please refresh the page and try again.');
          }
        } catch (error) {
          console.error(`Error ${action}ing user:`, error);
          alert(`Failed to ${action} user. Please try again.`);
        }
      }
    }
    
    // Add event listeners for filter inputs
    document.getElementById('search-input').addEventListener('input', filterUsers);
    document.getElementById('role-filter').addEventListener('change', filterUsers);
    document.getElementById('status-filter').addEventListener('change', filterUsers);
    
    // Toggle password visibility
    document.getElementById('toggle-password').addEventListener('click', function() {
      const passwordInput = document.getElementById('user-password');
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.textContent = type === 'password' ? 'Show' : 'Hide';
    });
    
    // Modal handling
    document.getElementById('add-user-btn').addEventListener('click', () => {
      currentUserId = null;
      document.getElementById('modal-title').textContent = 'Add New User';
      document.getElementById('user-form').reset();
      document.getElementById('user-modal').style.display = 'flex';
    });
    
    // Close modal
    document.querySelectorAll('.close-btn, .close-modal').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('user-modal').style.display = 'none';
      });
    });
    
    // Form submit handler
    document.getElementById('user-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      try {
        const userData = {
          name: document.getElementById('user-name').value,
          username: document.getElementById('username').value,
          email: document.getElementById('user-email').value,
          role: document.getElementById('user-role').value,
          status: 'active' // Set default status as active for new users
        };
        
        const password = document.getElementById('user-password').value;
        
        if (currentUserId === null) {
          // Add new user
          if (!password) {
            alert('Password is required when creating a new user.');
            return;
          }
          
          // Include password for new users
          userData.password = password;
          
          // Check for duplicate username
          const existingUsers = await window.api.getUsers();
          const duplicateUser = existingUsers.find(u => u.username === userData.username);
          if (duplicateUser) {
            alert('Username already exists. Please choose a different username.');
            return;
          }
          
          await window.api.addUser(userData);
          alert('User created successfully.');
        } else {
          // Update existing user
          if (password) {
            userData.password = password;
          }
          await window.api.updateUser(currentUserId, userData);
          alert('User updated successfully.');
        }
        
        // Close modal and refresh user list
        document.getElementById('user-modal').style.display = 'none';
        loadUsers();
      } catch (error) {
        // Use the utility function to handle the error and recover the form
        handleApiError('saving user', error, '#user-form');
        
        // Ensure all form inputs are responsive after error
        const inputs = document.querySelectorAll('#user-form input, #user-form select');
        inputs.forEach(input => {
          input.disabled = false;
          input.readOnly = false;
        });
        
        // Re-attach password toggle functionality
        setTimeout(() => {
          document.getElementById('toggle-password')?.addEventListener('click', function() {
            const passwordInput = document.getElementById('user-password');
            if (passwordInput) {
              const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
              passwordInput.setAttribute('type', type);
              this.textContent = type === 'password' ? 'Show' : 'Hide';
            }
          });
        }, 100);
      }
    });
    
    // Initial load
    loadUsers();
  </script>
</body>
</html>
