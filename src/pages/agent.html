<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Management - Agents</title>
  <link rel="stylesheet" href="../components/Navbar.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eaeaea;
    }

    header h1 {
      color: #333;
      margin: 0;
      font-size: 24px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: #4a6cf7;
      color: white;
    }

    .btn-primary:hover {
      background-color: #3a5bd9;
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid #4a6cf7;
      color: #4a6cf7;
    }

    .btn-outline:hover {
      background-color: #f0f4ff;
    }

    .btn-danger {
      background-color: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background-color: #c82333;
    }

    .page-content {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th {
      background-color: #f9f9f9;
      text-align: left;
      padding: 12px 15px;
      font-weight: 600;
      color: #333;
      border-bottom: 1px solid #eaeaea;
    }

    .data-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #eaeaea;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .data-table tr:hover {
      background-color: #f5f9ff;
    }

    .action-cell {
      display: flex;
      gap: 8px;
    }

    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      align-items: center;
    }

    .filter-bar input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      width: 200px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      width: 500px;
      max-width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #666;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .agent-details {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .detail-item {
      font-size: 16px;
      color: #333;
    }
    
    .details-section {
      margin-bottom: 25px;
    }
    .details-section h3 {
      margin: 0 0 15px 0;
      color: #333;
      font-size: 18px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eaeaea;
    }
    .details-row {
      display: flex;
      margin-bottom: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .details-label {
      width: 150px;
      font-weight: 500;
      color: #666;
    }
    .details-value {
      flex: 1;
      color: #333;
    }
    .vendor-details-container {
      padding: 20px 0;
    }
  </style>
</head>

<body>
  <div class="app-container">
    <!-- Navbar container -->
    <div id="navbar-container"></div>

    <!-- Main content -->
    <div class="main-content">
      <div class="container">
        <header>
          <h1>Agents</h1>
          <div class="header-actions">
            <button id="download-pdf-btn" class="btn btn-outline">Download PDF</button>
            <button id="add-agent-btn" class="btn btn-primary">Add New Agent</button>
          </div>
        </header>

        <div class="page-content">
          <div class="filter-bar">
            <input type="text" id="search-input" placeholder="Search agents...">
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th>Serial Number</th>
                <th>Agent Name</th>
                <th>Contact Number</th>
                <th>City</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="agents-table-body">
              <tr>
                <td>1</td>
                <td>John Doe</td>
                <td>+1 234 567 890</td>
                <td>New York</td>
                <td class="action-cell">
                  <button class="btn btn-outline view-btn" data-id="1">View</button>
                  <button class="btn btn-outline edit-btn" data-id="1">Edit</button>
                  <button class="btn btn-danger delete-btn" data-id="1">Delete</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- View Agent Modal -->
  <div id="view-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Agent Details</h2>
        <button class="close-btn">&times;</button>
      </div>
      <div class="vendor-details-container">
        <div class="details-section">
          <h3>Basic Information</h3>
          <div class="details-row">
            <div class="details-label">Agent Name:</div>
            <div class="details-value" id="view-agent-name"></div>
          </div>
          <div class="details-row">
            <div class="details-label">Contact Number:</div>
            <div class="details-value" id="view-agent-contact"></div>
          </div>
          <div class="details-row">
            <div class="details-label">Email:</div>
            <div class="details-value" id="view-agent-email"></div>
          </div>
        </div>
        <div class="details-section">
          <h3>Additional Information</h3>
          <div class="details-row">
            <div class="details-label">City:</div>
            <div class="details-value" id="view-agent-city"></div>
          </div>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-outline close-modal">Close</button>
      </div>
    </div>
  </div>

  <!-- Add/Edit Agent Modal -->
  <div id="agent-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="agent-modal-title">Add New Agent</h2>
        <button class="close-btn">&times;</button>
      </div>
      <form id="agent-form">
        <div class="form-group">
          <label for="agent-name">Agent Name</label>
          <input type="text" id="agent-name" required>
        </div>
        <div class="form-group">
          <label for="agent-contact">Contact Number</label>
          <input type="tel" id="agent-contact" required>
        </div>
        <div class="form-group">
          <label for="agent-city">City</label>
          <input type="text" id="agent-city" required>
        </div>
        <div class="form-group">
          <label for="agent-email">Email</label>
          <input type="email" id="agent-email">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Agent</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../components/Navbar.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <script>
    // Check if user is logged in
    const userString = sessionStorage.getItem('user');
    if (!userString) {
      window.location.href = 'login.html';
    }

    let agents = [];

    // Function to generate and download PDF
    function generatePDF() {
      // Initialize jsPDF
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      // Add title
      doc.setFontSize(18);
      doc.text('Agents List', 14, 22);
      
      // Add date
      doc.setFontSize(11);
      doc.text(`Generated on: ${new Date().toLocaleDateString()}`, 14, 30);
      
      // Define table columns
      const columns = [
        { header: 'Serial Number', dataKey: 'id' },
        { header: 'Agent Name', dataKey: 'name' },
        { header: 'Contact Number', dataKey: 'contact' },
        { header: 'Email', dataKey: 'email' },
        { header: 'City', dataKey: 'city' }
      ];
      
      // Convert agents data for autotable
      const data = agents.map((agent, index) => {
        return {
          id: index + 1,
          name: agent.name,
          contact: agent.contact || '-',
          email: agent.email || '-',
          city: agent.city || '-'
        };
      });
      
      // Create the autotable
      doc.autoTable({
        startY: 40,
        head: [columns.map(col => col.header)],
        body: data.map(item => columns.map(col => item[col.dataKey])),
        theme: 'grid',
        headStyles: {
          fillColor: [74, 108, 247],
          textColor: [255, 255, 255],
          fontStyle: 'bold'
        },
        alternateRowStyles: {
          fillColor: [240, 244, 255]
        }
      });
      
      // Save the PDF
      doc.save('agents_list.pdf');
    }

    // Add event listener for download PDF button
    document.getElementById('download-pdf-btn').addEventListener('click', generatePDF);

    // Load agents function
    async function loadAgents() {
      try {
        agents = await window.api.getAgents();
      renderAgentsTable(agents);
      } catch (error) {
        console.error('Error loading agents:', error);
      }
    }

    // Render agents table
    function renderAgentsTable(agentsList) {
      const tableBody = document.getElementById('agents-table-body');
      tableBody.innerHTML = '';

      agentsList.forEach((agent, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${agent.name}</td>
          <td>${agent.contact || '-'}</td>
          <td>${agent.city || '-'}</td>
          <td class="action-cell">
            <button class="btn btn-outline view-btn" data-id="${agent.id}">View</button>
            <button class="btn btn-outline edit-btn" data-id="${agent.id}">Edit</button>
            <button class="btn btn-danger delete-btn" data-id="${agent.id}">Delete</button>
          </td>
        `;
        tableBody.appendChild(row);
      });

      // Add event listeners to action buttons
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', handleViewAgent);
      });
      
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', handleEditAgent);
      });
      
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', handleDeleteAgent);
      });
    }

    // Search functionality
    document.getElementById('search-input').addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase();
      
      const filteredAgents = agents.filter(agent => {
        return agent.name.toLowerCase().includes(searchTerm) || 
               (agent.contact && agent.contact.toLowerCase().includes(searchTerm)) ||
               (agent.city && agent.city.toLowerCase().includes(searchTerm));
      });
      
      renderAgentsTable(filteredAgents);
    });

    // View agent handler with modal
    function handleViewAgent(e) {
      const agentId = e.target.dataset.id;
      const agent = agents.find(a => a.id === agentId);
      
      if (agent) {
        document.getElementById('view-agent-name').textContent = agent.name || '-';
        document.getElementById('view-agent-contact').textContent = agent.contact || '-';
        document.getElementById('view-agent-city').textContent = agent.city || '-';
        document.getElementById('view-agent-email').textContent = agent.email || '-';

        const viewModal = document.getElementById('view-modal');
        viewModal.style.display = 'flex';
      }
    }

    // Edit agent handler
    function handleEditAgent(e) {
      const agentId = e.target.dataset.id;
      const agent = agents.find(a => a.id === agentId);
      
      if (agent) {
        document.getElementById('agent-modal-title').textContent = 'Edit Agent';
        document.getElementById('agent-name').value = agent.name || '';
        document.getElementById('agent-contact').value = agent.contact || '';
        document.getElementById('agent-city').value = agent.city || '';
        document.getElementById('agent-email').value = agent.email || '';
        
        // Store current agent id for update
        document.getElementById('agent-form').dataset.agentId = agent.id;
        
        const agentModal = document.getElementById('agent-modal');
        agentModal.style.display = 'flex';
      }
    }
    
    // Delete agent handler
    async function handleDeleteAgent(e) {
      const agentId = e.target.dataset.id;
      const agent = agents.find(a => a.id === agentId);
      const agentName = agent ? agent.name : 'Unknown';
      
      if (confirm(`Are you sure you want to delete ${agentName}? This action cannot be undone.`)) {
        try {
          const result = await window.api.deleteAgent(agentId);
          if (result) {
            alert(`Agent "${agentName}" has been deleted successfully!`);
            loadAgents();
          } else {
            alert(`Failed to delete agent "${agentName}". Please try again.`);
          }
        } catch (error) {
          console.error('Error deleting agent:', error);
          alert(`Error deleting agent "${agentName}": ${error.message}`);
        }
      }
    }
    
    // Add Agent button event listener
    document.getElementById('add-agent-btn').addEventListener('click', () => {
      document.getElementById('agent-modal-title').textContent = 'Add New Agent';
      document.getElementById('agent-form').reset();
      // Clear agent ID for adding new agent
      document.getElementById('agent-form').dataset.agentId = '';
      
      const agentModal = document.getElementById('agent-modal');
      agentModal.style.display = 'flex';
    });
    
    // Close modals
    document.querySelectorAll('.close-btn, .close-modal').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('view-modal').style.display = 'none';
        document.getElementById('agent-modal').style.display = 'none';
      });
    });
    
    // Agent form submit handler
    document.getElementById('agent-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const agentData = {
        name: document.getElementById('agent-name').value,
        contact: document.getElementById('agent-contact').value,
        city: document.getElementById('agent-city').value,
        email: document.getElementById('agent-email').value
      };
      
      const agentId = document.getElementById('agent-form').dataset.agentId;
      
      try {
        if (agentId) {
          // Update existing agent
          await window.api.updateAgent(agentId, agentData);
          // Close modal after updating
          document.getElementById('agent-modal').style.display = 'none';
        } else {
          // Add new agent
          await window.api.addAgent(agentData);
          
          // Reset form for next agent entry instead of closing modal
          document.getElementById('agent-form').reset();
          
          // Show success message
          const successMessage = document.createElement('div');
          successMessage.textContent = `Agent ${agentData.name} added successfully!`;
          successMessage.style.color = '#28a745';
          successMessage.style.marginBottom = '15px';
          successMessage.style.fontWeight = '500';
          successMessage.id = 'agent-success-message';
          
          // Remove any existing success message
          const existingMessage = document.getElementById('agent-success-message');
          if (existingMessage) {
            existingMessage.remove();
          }
          
          // Insert before the form
          const form = document.getElementById('agent-form');
          form.parentNode.insertBefore(successMessage, form);
          
          // Auto-focus the agent name field for the next entry
          document.getElementById('agent-name').focus();
          
          // Hide success message after 3 seconds
          setTimeout(() => {
            successMessage.style.display = 'none';
          }, 3000);
        }
        
        // Refresh agent list
        loadAgents();
      } catch (error) {
        console.error('Error saving agent:', error);
        alert('Failed to save agent. Please try again.');
      }
    });

    // Initial render
    loadAgents();

    // Listen for real-time data syncs from MongoDB
    window.api.onDataSync((event, changeEvent) => {
      console.log('📡 Agent data sync received:', changeEvent);
      
      // Reload agents if agents collection changed
      if (changeEvent.collection === 'agents') {
        console.log('🔄 Reloading agents from sync event...');
        loadAgents();
      }
    });
  </script>
</body>

</html>
