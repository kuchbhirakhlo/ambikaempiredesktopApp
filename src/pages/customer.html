<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Management - Customers</title>
  <link rel="stylesheet" href="../components/Navbar.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eaeaea;
    }

    header h1 {
      color: #333;
      margin: 0;
      font-size: 24px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: #4a6cf7;
      color: white;
    }

    .btn-primary:hover {
      background-color: #3a5bd9;
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid #4a6cf7;
      color: #4a6cf7;
    }

    .btn-outline:hover {
      background-color: #f0f4ff;
    }

    .btn-danger {
      background-color: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background-color: #c82333;
    }

    .page-content {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th {
      background-color: #f9f9f9;
      text-align: left;
      padding: 12px 15px;
      font-weight: 600;
      color: #333;
      border-bottom: 1px solid #eaeaea;
    }

    .data-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #eaeaea;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .data-table tr:hover {
      background-color: #f5f9ff;
    }

    .action-cell {
      display: flex;
      gap: 8px;
    }

    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      align-items: center;
    }

    .filter-bar input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      width: 200px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      width: 500px;
      max-width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #666;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .customer-details {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .detail-item {
      font-size: 16px;
      color: #333;
    }

    .details-section {
      margin-bottom: 25px;
    }
    .details-section h3 {
      margin: 0 0 15px 0;
      color: #333;
      font-size: 18px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eaeaea;
    }
    .details-row {
      display: flex;
      margin-bottom: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .details-label {
      width: 150px;
      font-weight: 500;
      color: #666;
    }
    .details-value {
      flex: 1;
      color: #333;
    }
    .vendor-details-container {
      padding: 20px 0;
    }

    .sortable {
      cursor: pointer;
      position: relative;
    }
    
    .sortable:hover {
      background-color: #f0f4ff;
    }
    
    .sort-icon {
      font-size: 12px;
      margin-left: 5px;
    }
    
    .sort-asc .sort-icon:after {
      content: "↑";
    }
    
    .sort-desc .sort-icon:after {
      content: "↓";
    }
  </style>
</head>

<body>
  <div class="app-container">
    <!-- Navbar container -->
    <div id="navbar-container"></div>

    <!-- Main content -->
    <div class="main-content">
      <div class="container">
        <header>
          <h1>Customers</h1>
          <div class="header-actions">
            <button id="download-pdf-btn" class="btn btn-outline">Download PDF</button>
            <button id="add-customer-btn" class="btn btn-primary">Add New Customer</button>
          </div>
        </header>

        <div class="page-content">
          <div class="filter-bar">
            <input type="text" id="search-input" placeholder="Search customers...">
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th>S.No</th>
                <th>Customer ID</th>
                <th class="sortable" data-sort="name">Customer Name <span class="sort-icon">↕</span></th>
                <th>Contact Number</th>
                <th>Agent</th>
                <th>Address/City</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="customers-table-body">
              <!-- Customer data will be loaded here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- View Customer Modal -->
  <div id="view-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Customer Details</h2>
        <button class="close-btn">&times;</button>
      </div>
      <div class="vendor-details-container">
        <div class="details-section">
          <h3>Basic Information</h3>
          <div class="details-row">
            <div class="details-label">Customer Name:</div>
            <div class="details-value" id="view-customer-name"></div>
          </div>
          <div class="details-row">
            <div class="details-label">Contact Number:</div>
            <div class="details-value" id="view-customer-contact"></div>
          </div>
          <div class="details-row">
            <div class="details-label">Customer ID:</div>
            <div class="details-value" id="view-customer-id"></div>
          </div>
        </div>
        <div class="details-section">
          <h3>Additional Information</h3>
          <div class="details-row">
            <div class="details-label">Agent:</div>
            <div class="details-value" id="view-customer-agent"></div>
          </div>
          <div class="details-row">
            <div class="details-label">Address/City:</div>
            <div class="details-value" id="view-customer-address"></div>
          </div>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-outline close-modal">Close</button>
      </div>
    </div>
  </div>

  <!-- Add/Edit Customer Modal -->
  <div id="customer-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="customer-modal-title">Add New Customer</h2>
        <button class="close-btn">&times;</button>
      </div>
      <form id="customer-form">
        <div class="form-group">
          <label for="customer-name">Customer Name</label>
          <input type="text" id="customer-name" required>
        </div>
        <div class="form-group">
          <label for="customer-contact">Contact Number</label>
          <input type="tel" id="customer-contact" required>
        </div>
        <div class="form-group">
          <label for="customer-agent">Agent</label>
          <select id="customer-agent" required>
            <option value="">Select Agent</option>
          </select>
        </div>
        <div class="form-group">
          <label for="customer-address">Address/City</label>
          <input type="text" id="customer-address" required>
        </div>
        <div class="form-group">
          <label for="customer-id">Customer ID</label>
          <input type="text" id="customer-id" placeholder="Leave empty for auto-generated ID">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Customer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../components/Navbar.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <script>
    // Check if user is logged in
    const userString = sessionStorage.getItem('user');
    if (!userString) {
      window.location.href = 'login.html';
    }

    let customers = [];
    let agents = [];
    let currentSortField = null;
    let currentSortDirection = 'asc';

    // Function to generate and download PDF
    function generatePDF() {
      // Initialize jsPDF
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      // Add title
      doc.setFontSize(18);
      doc.text('Customers List', 14, 22);
      
      // Add date
      doc.setFontSize(11);
      doc.text(`Generated on: ${new Date().toLocaleDateString()}`, 14, 30);
      
      // Define table columns
      const columns = [
        { header: 'Serial No.', dataKey: 'id' },
        { header: 'Customer ID', dataKey: 'customer_ref_id' },
        { header: 'Customer Name', dataKey: 'name' },
        { header: 'Contact Number', dataKey: 'contact' },
        { header: 'Email', dataKey: 'email' },
        { header: 'Agent', dataKey: 'agent' },
        { header: 'Address/City', dataKey: 'address' }
      ];
      
      // Convert customers data for autotable
      const data = customers.map((customer, index) => {
        return {
          id: index + 1,
          customer_ref_id: customer.customer_ref_id || '-',
          name: customer.name,
          contact: customer.contact || '-',
          email: customer.email || '-',
          agent: customer.agent || '-',
          address: customer.address || '-'
        };
      });
      
      // Create the autotable
      doc.autoTable({
        startY: 40,
        head: [columns.map(col => col.header)],
        body: data.map(item => columns.map(col => item[col.dataKey])),
        theme: 'grid',
        headStyles: {
          fillColor: [74, 108, 247],
          textColor: [255, 255, 255],
          fontStyle: 'bold'
        },
        alternateRowStyles: {
          fillColor: [240, 244, 255]
        }
      });
      
      // Save the PDF
      doc.save('customers_list.pdf');
    }

    // Add event listener for download PDF button
    document.getElementById('download-pdf-btn').addEventListener('click', generatePDF);

    // Load agents function to populate the dropdown
    async function loadAgents() {
      try {
        agents = await window.api.getAgents();
        populateAgentDropdown();
      } catch (error) {
        console.error('Error loading agents:', error);
      }
    }

    // Populate agent dropdown
    function populateAgentDropdown() {
      const agentSelect = document.getElementById('customer-agent');
      // Clear existing options except the default
      while (agentSelect.options.length > 1) {
        agentSelect.remove(1);
      }
      
      // Add agents to dropdown
      agents.forEach(agent => {
        const option = document.createElement('option');
        option.value = agent.name;
        option.textContent = agent.name;
        agentSelect.appendChild(option);
      });
    }

    // Load customers function
    async function loadCustomers() {
      try {
        customers = await window.api.getCustomers();
      renderCustomersTable(customers);
      } catch (error) {
        console.error('Error loading customers:', error);
      }
    }

    // Render customers table
    function renderCustomersTable(customersList) {
      const tableBody = document.getElementById('customers-table-body');
      tableBody.innerHTML = '';

      customersList.forEach((customer, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${customer.customer_ref_id || '-'}</td>
          <td>${customer.name}</td>
          <td>${customer.contact || '-'}</td>
          <td>${customer.agent || '-'}</td>
          <td>${customer.address || '-'}</td>
          <td class="action-cell">
            <button class="btn btn-outline view-btn" data-id="${customer.id}">View</button>
            <button class="btn btn-outline edit-btn" data-id="${customer.id}">Edit</button>
            <button class="btn btn-danger delete-btn" data-id="${customer.id}">Delete</button>
          </td>
        `;
        tableBody.appendChild(row);
      });

      // Add event listeners to action buttons
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', handleViewCustomer);
      });
      
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', handleEditCustomer);
      });
      
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', handleDeleteCustomer);
      });
    }

    // Search functionality
    document.getElementById('search-input').addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase();
      
      const filteredCustomers = customers.filter(customer => {
        return customer.name.toLowerCase().includes(searchTerm) || 
               (customer.contact && customer.contact.toLowerCase().includes(searchTerm)) ||
               (customer.address && customer.address.toLowerCase().includes(searchTerm)) ||
               (customer.agent && customer.agent.toLowerCase().includes(searchTerm));
      });
      
      renderCustomersTable(filteredCustomers);
    });

    // View customer handler with modal
    function handleViewCustomer(e) {
      const customerId = e.target.dataset.id;
      const customer = customers.find(c => c.id === customerId);
      
      if (customer) {
        document.getElementById('view-customer-name').textContent = customer.name || '-';
        document.getElementById('view-customer-contact').textContent = customer.contact || '-';
        document.getElementById('view-customer-agent').textContent = customer.agent || '-';
        document.getElementById('view-customer-address').textContent = customer.address || '-';
        document.getElementById('view-customer-id').textContent = customer.customer_ref_id || '-';

        const viewModal = document.getElementById('view-modal');
        viewModal.style.display = 'flex';
      }
    }

    // Edit customer handler
    function handleEditCustomer(e) {
      const customerId = e.target.dataset.id;
      const customer = customers.find(c => c.id === customerId);
      
      if (customer) {
        document.getElementById('customer-modal-title').textContent = 'Edit Customer';
        document.getElementById('customer-name').value = customer.name || '';
        document.getElementById('customer-contact').value = customer.contact || '';
        document.getElementById('customer-agent').value = customer.agent || '';
        document.getElementById('customer-address').value = customer.address || '';
        document.getElementById('customer-id').value = customer.customer_ref_id || '';
        
        // Store current customer id for update
        document.getElementById('customer-form').dataset.customerId = customer.id;
        
        const customerModal = document.getElementById('customer-modal');
        customerModal.style.display = 'flex';
      }
    }
    
    // Delete customer handler
    async function handleDeleteCustomer(e) {
      const customerId = e.target.dataset.id;
      const customer = customers.find(c => c.id === customerId);
      const customerName = customer ? customer.name : 'Unknown';
      
      if (confirm(`Are you sure you want to delete ${customerName}? This action cannot be undone.`)) {
        try {
          const result = await window.api.deleteCustomer(customerId);
          if (result) {
            alert(`Customer "${customerName}" has been deleted successfully!`);
            loadCustomers();
          } else {
            alert(`Failed to delete customer "${customerName}". Please try again.`);
          }
        } catch (error) {
          console.error('Error deleting customer:', error);
          alert(`Error deleting customer "${customerName}": ${error.message}`);
        }
      }
    }
    
    // Add Customer button event listener
    document.getElementById('add-customer-btn').addEventListener('click', () => {
      document.getElementById('customer-modal-title').textContent = 'Add New Customer';
      document.getElementById('customer-form').reset();
      // Clear customer ID for adding new customer
      document.getElementById('customer-form').dataset.customerId = '';
      
      const customerModal = document.getElementById('customer-modal');
      customerModal.style.display = 'flex';
    });
    
    // Close modals
    document.querySelectorAll('.close-btn, .close-modal').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('view-modal').style.display = 'none';
        document.getElementById('customer-modal').style.display = 'none';
      });
    });
    
    // Customer form submit handler
    document.getElementById('customer-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const customerData = {
        name: document.getElementById('customer-name').value,
        contact: document.getElementById('customer-contact').value,
        agent: document.getElementById('customer-agent').value,
        address: document.getElementById('customer-address').value,
        // Use customer_ref_id for the manually entered ID
        customer_ref_id: document.getElementById('customer-id').value
      };
      
      const customerId = document.getElementById('customer-form').dataset.customerId;
      const submitBtn = document.querySelector('#customer-form button[type="submit"]');
      const originalText = submitBtn.textContent;
      
      try {
        // Disable submit button during submission
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';
        
        if (customerId) {
          // Update existing customer
          await window.api.updateCustomer(customerId, customerData);
          // Close modal after updating
          document.getElementById('customer-modal').style.display = 'none';
          alert('Customer updated successfully!');
        } else {
          // Add new customer
          await window.api.addCustomer(customerData);
          
          // Show success message
          const successMessage = document.createElement('div');
          successMessage.textContent = `✓ Customer "${customerData.name}" added successfully!`;
          successMessage.style.cssText = 'color: #28a745; margin-bottom: 15px; font-weight: 500; padding: 10px; background-color: #d4edda; border-radius: 4px; border: 1px solid #c3e6cb;';
          successMessage.id = 'customer-success-message';
          
          // Remove any existing success message
          const existingMessage = document.getElementById('customer-success-message');
          if (existingMessage) {
            existingMessage.remove();
          }
          
          // Insert before the form
          const form = document.getElementById('customer-form');
          form.parentNode.insertBefore(successMessage, form);
          
          // Reset form for next customer entry
          document.getElementById('customer-form').reset();
          
          // Auto-focus the customer name field for the next entry
          document.getElementById('customer-name').focus();
          
          // Hide success message after 4 seconds
          setTimeout(() => {
            if (successMessage.parentNode) {
              successMessage.remove();
            }
          }, 4000);
        }
        
        // Always refresh customer list after successful save
        await loadCustomers();
        
      } catch (error) {
        console.error('Error saving customer:', error);
        alert('Failed to save customer. Error: ' + (error.message || 'Unknown error'));
      } finally {
        // Re-enable submit button
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    // Add event listeners to sortable headers
    document.querySelectorAll('.sortable').forEach(header => {
      header.addEventListener('click', function() {
        const sortField = this.dataset.sort;
        
        // Toggle sort direction if clicking the same header again
        if (sortField === currentSortField) {
          currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
        } else {
          currentSortField = sortField;
          currentSortDirection = 'asc';
        }
        
        // Update visual indicators
        document.querySelectorAll('.sortable').forEach(el => {
          el.classList.remove('sort-asc', 'sort-desc');
        });
        
        this.classList.add(currentSortDirection === 'asc' ? 'sort-asc' : 'sort-desc');
        
        // Sort the data
        sortCustomers(sortField, currentSortDirection);
      });
    });
    
    // Function to sort customers
    function sortCustomers(field, direction) {
      const sortedCustomers = [...customers].sort((a, b) => {
        const valueA = (a[field] || '').toString().toLowerCase();
        const valueB = (b[field] || '').toString().toLowerCase();
        
        if (valueA < valueB) {
          return direction === 'asc' ? -1 : 1;
        }
        if (valueA > valueB) {
          return direction === 'asc' ? 1 : -1;
        }
        return 0;
      });
      
      renderCustomersTable(sortedCustomers);
    }

    // Listen for real-time data syncs from MongoDB
    window.api.onDataSync((event, changeEvent) => {
      console.log('📡 Data sync received:', changeEvent);
      
      // Reload customers if customers collection changed
      if (changeEvent.collection === 'customers') {
        console.log('🔄 Reloading customers from sync event...');
        loadCustomers();
      }
    });

    // Initial load
    loadAgents();
    loadCustomers();
  </script>
</body>

</html>
