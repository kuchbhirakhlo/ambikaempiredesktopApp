<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Management - Inventory</title>
  <link rel="stylesheet" href="../components/Navbar.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eaeaea;
    }

    header h1 {
      color: #333;
      margin: 0;
      font-size: 24px;
    }

    .stock-summary {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stock-card {
      padding: 20px;
      border-radius: 10px;
      color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }

    .stock-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .stock-card h3 {
      margin-top: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .stock-card-value {
      font-size: 32px;
      font-weight: 700;
      margin: 10px 0;
    }

    .stock-card-footer {
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .low-stock {
      background-color: #f44336;
    }

    .medium-stock {
      background-color: #2196f3;
    }

    .high-stock {
      background-color: #4caf50;
    }

    .page-content {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .table-header h2 {
      margin: 0;
      font-size: 20px;
      color: #333;
    }

    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      align-items: center;
    }

    .filter-bar input,
    .filter-bar select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .filter-bar button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background-color: #4caf50;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .filter-bar button:hover {
      background-color: #45a049;
    }

    .upload-label {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background-color: #2196f3;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .upload-label:hover {
      background-color: #1e88e5;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th {
      background-color: #f9f9f9;
      text-align: left;
      padding: 12px 15px;
      font-weight: 600;
      color: #333;
      border-bottom: 1px solid #eaeaea;
    }

    .data-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #eaeaea;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .data-table tr:hover {
      background-color: #f5f9ff;
    }

    .stock-level {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      color: white;
    }

    .low {
      background-color: #f44336;
    }

    .medium {
      background-color: #2196f3;
    }

    .high {
      background-color: #4caf50;
    }
  </style>
</head>

<body>
  <div class="app-container">
    <!-- Navbar container -->
    <div id="navbar-container"></div>

    <!-- Main content -->
    <div class="main-content">
      <div class="container">
        <header>
          <h1>Inventory</h1>
        </header>

        <!-- Stock summary cards -->
        <div class="stock-summary">
          <div class="stock-card low-stock">
            <h3>Low Stock Items</h3>
            <div id="low-stock-count" class="stock-card-value">0</div>
            <div class="stock-card-footer">
              <span>0-36 units</span>
              <span>Critical</span>
            </div>
          </div>

          <div class="stock-card medium-stock">
            <h3>Medium Stock Items</h3>
            <div id="medium-stock-count" class="stock-card-value">0</div>
            <div class="stock-card-footer">
              <span>37-72 units</span>
              <span>Warning</span>
            </div>
          </div>

          <div class="stock-card high-stock">
            <h3>High Stock Items</h3>
            <div id="high-stock-count" class="stock-card-value">0</div>
            <div class="stock-card-footer">
              <span>73+ units</span>
              <span>Good</span>
            </div>
          </div>

          <div class="stock-card" style="background-color: #673ab7;">
            <h3>Total Products</h3>
            <div id="total-products" class="stock-card-value">0</div>
            <div class="stock-card-footer">
              <span>All items</span>
              <span>In inventory</span>
            </div>
          </div>
        </div>

        <!-- Stock table -->
        <div class="page-content">
          <div class="table-header">
            <h2>Inventory Status</h2>
            <div class="filter-bar">
              <input type="text" id="search-input" placeholder="Search products...">
              <select id="stock-filter">
                <option value="all">All Stock Levels</option>
                <option value="low">Low Stock</option>
                <option value="medium">Medium Stock</option>
                <option value="high">High Stock</option>
              </select>
              <select id="year-filter">
                <!-- Years will be populated dynamically -->
              </select>
              <button id="refresh-inventory-btn" title="Refresh Inventory Data">🔄 Refresh</button>
              <button id="add-product-btn">Add Purchase</button>
              <span style="margin-left: 15px; font-size: 12px; color: #666;">Last updated: <span
                  id="last-refresh-time">-</span></span>
            </div>
          </div>

          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Product Code</th>
                  <th>Product Name</th>
                  <th>Rate (₹)</th>
                  <th>Quantity Available</th>
                  <th>Stock Level</th>
                </tr>
              </thead>
              <tbody id="stock-table-body">
                <!-- Stock data will be loaded here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../components/Navbar.js"></script>
  <script>
    // Check if user is logged in
    const userString = sessionStorage.getItem('user');
    if (!userString) {
      window.location.href = 'login.html';
    }

    const user = JSON.parse(userString);
    let inventory = [];

    // Ensure the active year is set in the database before making API calls
    async function initializeYear() {
      const selectedYear = parseInt(sessionStorage.getItem('selectedYear') || new Date().getFullYear(), 10);
      if (window.api && window.api.setActiveYear) {
        await window.api.setActiveYear(selectedYear);
      }
      return selectedYear;
    }

    // Initialize the page when loaded
    document.addEventListener('DOMContentLoaded', async function () {
      const selectedYear = await initializeYear();
      try {
        // Populate year filter dropdown dynamically
        const yearSelect = document.getElementById('year-filter');
        const currentYear = new Date().getFullYear();
        const startYear = 2020;
        for (let y = currentYear + 1; y >= startYear; y--) {
          const option = document.createElement('option');
          option.value = y;
          option.textContent = y;
          yearSelect.appendChild(option);
        }

        await loadInventory();

        // Setup event listeners
        document.getElementById('search-input').addEventListener('input', filterInventory);
        document.getElementById('stock-filter').addEventListener('change', filterInventory);
        document.getElementById('year-filter').addEventListener('change', filterInventory);
        
        // Set default year filter to match login year
        const loginYear = sessionStorage.getItem('selectedYear');
        if (loginYear) {
          document.getElementById('year-filter').value = loginYear;
        }

        // Add refresh button event listener
        document.getElementById('refresh-inventory-btn').addEventListener('click', async function () {
          console.log("Manual refresh requested by user");
          this.textContent = "Refreshing...";
          this.disabled = true;

          try {
            await loadInventory();
            this.textContent = "🔄 Refresh";
            this.disabled = false;
          } catch (err) {
            console.error("Error during manual refresh:", err);
            this.textContent = "🔄 Refresh";
            this.disabled = false;
            alert("Failed to refresh inventory data. Please try again.");
          }
        });

        // Listen for custom inventory-update events from same window
        window.addEventListener('inventory-update', function (event) {
          console.log('Direct inventory update event received:', event.detail);
          loadInventory();
        });

        // Listen for real-time inventory updates from other pages
        window.addEventListener('storage', function (event) {
          console.log('Storage event detected in inventory.html:', event.key);

          // Handle different types of inventory updates
          if (event.key === 'inventory-update-timestamp' ||
            event.key === 'inventory-update-force' ||
            event.key === 'product-update-timestamp' ||
            event.key === 'order-update-timestamp' ||
            event.key === 'inventory-force-refresh' ||
            event.key === 'inventory-trigger-refresh') {

            console.log('Detected inventory/product/order changes, refreshing data');

            // Disable the refresh button during refresh to prevent multiple clicks
            const refreshBtn = document.getElementById('refresh-inventory-btn');
            if (refreshBtn) {
              refreshBtn.disabled = true;
              refreshBtn.textContent = "Refreshing...";
            }

            // Add a slight delay to ensure all events are processed
            setTimeout(async () => {
              try {
                await loadInventory();
                console.log('Inventory data refreshed successfully');

                // Reset the refresh button
                if (refreshBtn) {
                  refreshBtn.disabled = false;
                  refreshBtn.textContent = "🔄 Refresh";
                }
              } catch (error) {
                console.error('Error refreshing inventory data:', error);

                // Reset the refresh button
                if (refreshBtn) {
                  refreshBtn.disabled = false;
                  refreshBtn.textContent = "🔄 Refresh";
                }
              }
            }, 100);
          }
        });
      } catch (error) {
        console.error('Error initializing inventory page:', error);
        alert('Failed to load inventory data. Please try again.');
      }
    });

    // Load inventory data
    async function loadInventory() {
      try {
        console.log("Attempting to load inventory data...");
        // Use getProductsWithInventory to get complete product data with inventory information
        inventory = await window.api.getInventory();
        console.log("Successfully loaded inventory data with", inventory.length, "items");

        // Debug - log first few items to verify data
        if (inventory.length > 0) {
          console.log("Sample inventory items:", inventory.slice(0, 3));
        }

        // Update the UI with the new data
        updateStockSummary();
        filterInventory();

        // Update last refresh time
        const lastRefreshElement = document.getElementById('last-refresh-time');
        if (lastRefreshElement) {
          const now = new Date();
          lastRefreshElement.textContent = now.toLocaleTimeString();
        }

        // Store timestamp of last refresh
        localStorage.setItem('inventory-last-refresh', Date.now().toString());

        // Acknowledge that we've processed the force refresh if it exists
        if (localStorage.getItem('inventory-force-refresh')) {
          console.log("Processed forced refresh request");
          // Don't remove it as other instances might still need it
        }

        if (localStorage.getItem('inventory-trigger-refresh')) {
          console.log("Processed inventory trigger refresh");
          // Don't remove it as other instances might still need it
        }

        return true; // Signal successful loading
      } catch (error) {
        console.error('Error loading inventory:', error);

        // Don't show alert on every refresh as it can be annoying for automatic updates
        // Only show alert for user-initiated actions
        if (error.userInitiated) {
          alert('Error loading inventory data. Please try again.');
        }

        return false; // Signal failed loading
      }
    }

    // Update stock summary cards
    function updateStockSummary() {
      const lowStock = inventory.filter(item => item.quantity < 37);
      const mediumStock = inventory.filter(item => item.quantity >= 37 && item.quantity <= 72);
      const highStock = inventory.filter(item => item.quantity > 72);

      document.getElementById('low-stock-count').textContent = lowStock.length;
      document.getElementById('medium-stock-count').textContent = mediumStock.length;
      document.getElementById('high-stock-count').textContent = highStock.length;
      document.getElementById('total-products').textContent = inventory.length;
    }

    // Render inventory table
    function renderInventoryTable(items) {
      const tableBody = document.getElementById('stock-table-body');
      tableBody.innerHTML = '';

      if (items.length === 0) {
        const row = document.createElement('tr');
        row.innerHTML = '<td colspan="5" style="text-align: center;">No inventory items found</td>';
        tableBody.appendChild(row);
        return;
      }

      items.forEach(item => {
        let stockLevelClass = '';
        let stockLevelText = '';

        if (item.quantity < 37) {
          stockLevelClass = 'low';
          stockLevelText = 'Low';
        } else if (item.quantity <= 72) {
          stockLevelClass = 'medium';
          stockLevelText = 'Medium';
        } else {
          stockLevelClass = 'high';
          stockLevelText = 'High';
        }

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.code || '-'}</td>
          <td>${item.name || '-'}</td>
          <td>₹${item.price ? item.price.toFixed(2) : '0.00'}</td>
          <td>${item.quantity || 0}</td>
          <td><span class="stock-level ${stockLevelClass}">${stockLevelText}</span></td>
        `;

        // Add click event to view product details
        row.addEventListener('click', () => viewProductDetails(item));
        tableBody.appendChild(row);
      });
    }

    // View product details
    function viewProductDetails(item) {
      // Create a modal to show product details
      const modal = document.createElement('div');
      modal.style.position = 'fixed';
      modal.style.zIndex = '1000';
      modal.style.left = '0';
      modal.style.top = '0';
      modal.style.width = '100%';
      modal.style.height = '100%';
      modal.style.overflow = 'auto';
      modal.style.backgroundColor = 'rgba(0,0,0,0.4)';
      modal.style.display = 'flex';
      modal.style.alignItems = 'center';
      modal.style.justifyContent = 'center';

      const content = document.createElement('div');
      content.style.backgroundColor = '#fefefe';
      content.style.padding = '20px';
      content.style.border = '1px solid #888';
      content.style.width = '80%';
      content.style.maxWidth = '600px';
      content.style.borderRadius = '8px';
      content.style.boxShadow = '0 4px 8px rgba(0, 0, 0, 0.1)';

      content.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="margin: 0;">Product Details</h2>
          <span id="close-modal" style="cursor: pointer; font-size: 24px;">&times;</span>
        </div>
        <div style="margin-bottom: 10px;">
          <strong>Product Code:</strong> ${item.code || '-'}
        </div>
        <div style="margin-bottom: 10px;">
          <strong>Product Name:</strong> ${item.name || '-'}
        </div>
        <div style="margin-bottom: 10px;">
          <strong>Size:</strong> ${item.size || '-'}
        </div>
        <div style="margin-bottom: 10px;">
          <strong>Category:</strong> ${item.category || '-'}
        </div>
        <div style="margin-bottom: 10px;">
          <strong>Price:</strong> ₹${item.price ? item.price.toFixed(2) : '0.00'}
        </div>
        <div style="margin-bottom: 10px;">
          <strong>Quantity in Stock:</strong> ${item.quantity || 0}
        </div>
        <div style="margin-bottom: 10px;">
          <strong>Location:</strong> ${item.location || 'Main Warehouse'}
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
          <button id="update-stock-btn" style="background-color: #4caf50; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-right: 10px;">Update Stock</button>
          <button id="close-btn" style="background-color: #f44336; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Close</button>
        </div>
      `;

      modal.appendChild(content);
      document.body.appendChild(modal);

      // Close modal when clicking X or Close button
      document.getElementById('close-modal').addEventListener('click', () => {
        document.body.removeChild(modal);
      });

      document.getElementById('close-btn').addEventListener('click', () => {
        document.body.removeChild(modal);
      });

      // Update stock button
      document.getElementById('update-stock-btn').addEventListener('click', async () => {
        try {
          document.body.removeChild(modal);
          await updateStockForProduct(item);
        } catch (error) {
          console.error('Error updating stock:', error);
          alert('Failed to update stock. Please try again.');
        }
      });
    }

    // Update stock for a specific product
    async function updateStockForProduct(item) {
      const currentQuantity = item.quantity || 0;

      // Create a dropdown for quantity selection
      const modal = document.createElement('div');
      modal.style.position = 'fixed';
      modal.style.zIndex = '1000';
      modal.style.left = '0';
      modal.style.top = '0';
      modal.style.width = '100%';
      modal.style.height = '100%';
      modal.style.overflow = 'auto';
      modal.style.backgroundColor = 'rgba(0,0,0,0.4)';
      modal.style.display = 'flex';
      modal.style.alignItems = 'center';
      modal.style.justifyContent = 'center';

      const content = document.createElement('div');
      content.style.backgroundColor = '#fefefe';
      content.style.padding = '20px';
      content.style.border = '1px solid #888';
      content.style.width = '80%';
      content.style.maxWidth = '500px';
      content.style.borderRadius = '8px';
      content.style.boxShadow = '0 4px 8px rgba(0, 0, 0, 0.1)';

      content.innerHTML = `
        <h2>Update Stock for ${item.name}</h2>
        <p>Current quantity: ${currentQuantity}</p>
        <div style="margin-bottom: 15px;">
          <label for="quantity-input" style="display: block; margin-bottom: 5px;">Quantity to ADD:</label>
          <input type="number" id="quantity-input" list="quantity-list" min="1" max="1200" style="width: 100%; padding: 8px;">
          <datalist id="quantity-list">
            ${Array.from({ length: 1200 }, (_, i) => i + 1).map(num => `<option value="${num}">`).join('')}
          </datalist>
          <small style="color: #666; display: block; margin-top: 5px;">This quantity will be ADDED to the existing inventory.</small>
        </div>
        <div style="margin-bottom: 15px;">
          <label for="location-input" style="display: block; margin-bottom: 5px;">Location:</label>
          <input type="text" id="location-input" value="${item.location || 'Main Warehouse'}" style="width: 100%; padding: 8px;">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
          <button id="cancel-btn" style="padding: 8px 16px; border: none; border-radius: 4px; background-color: #f44336; color: white; cursor: pointer;">Cancel</button>
          <button id="submit-btn" style="padding: 8px 16px; border: none; border-radius: 4px; background-color: #4caf50; color: white; cursor: pointer;">Update</button>
        </div>
      `;

      modal.appendChild(content);
      document.body.appendChild(modal);

      // Cancel button
      document.getElementById('cancel-btn').addEventListener('click', () => {
        document.body.removeChild(modal);
      });

      // Submit button
      document.getElementById('submit-btn').addEventListener('click', async () => {
        const quantityToAdd = parseInt(document.getElementById('quantity-input').value, 10);
        const location = document.getElementById('location-input').value;

        const newQuantity = currentQuantity + quantityToAdd;

        if (confirm(`Are you sure you want to add ${quantityToAdd} units?\n\nCurrent quantity: ${currentQuantity}\nNew quantity will be: ${newQuantity}`)) {
          document.body.removeChild(modal);

          try {
            // Call the API to update inventory
            await window.api.updateInventory({
              productId: item.id,
              quantity: quantityToAdd,  // We send the quantity to ADD, not the total
              location,
              userId: user.id
            });

            // Reload inventory data to show the updated quantities
            await loadInventory();

            alert(`Stock for ${item.name} has been updated successfully!\n\nPrevious quantity: ${currentQuantity}\nAdded: ${quantityToAdd}\nNew total: ${newQuantity}`);
          } catch (error) {
            console.error('Error updating inventory:', error);
            alert('Failed to update inventory. Please try again.');
          }
        }
      });
    }

    // Filter inventory based on search input, stock level, and year
    function filterInventory() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const stockFilter = document.getElementById('stock-filter').value;
      const yearFilter = document.getElementById('year-filter').value;

      let filteredItems = inventory.filter(item => {
        const matchesSearch =
          (item.name && item.name.toLowerCase().includes(searchTerm)) ||
          (item.code && item.code.toLowerCase().includes(searchTerm));

        // Filter by year - check if item has a year field or use created_at date
        let matchesYear = true;
        if (yearFilter) {
          const itemYear = item.year || (item.created_at ? new Date(item.created_at).getFullYear() : null);
          matchesYear = itemYear === parseInt(yearFilter);
        }

        if (stockFilter === 'all') {
          return matchesSearch && matchesYear;
        } else if (stockFilter === 'low') {
          return matchesSearch && matchesYear && item.quantity < 37;
        } else if (stockFilter === 'medium') {
          return matchesSearch && matchesYear && item.quantity >= 37 && item.quantity <= 72;
        } else if (stockFilter === 'high') {
          return matchesSearch && matchesYear && item.quantity > 72;
        }

        return matchesSearch && matchesYear;
      });

      // Sort by stock level (low to high)
      filteredItems.sort((a, b) => (a.quantity || 0) - (b.quantity || 0));

      renderInventoryTable(filteredItems);
    }

    // Add event listener for "Add Product" button
    document.getElementById('add-product-btn').addEventListener('click', async () => {
      try {
        // Get all products
        const products = await window.api.getProducts();

        // Create a dropdown HTML for the prompt
        let productSelectHtml = `
          <select id="product-select" style="width: 100%; padding: 8px; margin-bottom: 10px;">
            <option value="">Select a product</option>
            ${products.map(p => `<option value="${p.id}">${p.code} - ${p.name}</option>`).join('')}
          </select>
        `;

        // Custom prompt with dropdown
        const modal = document.createElement('div');
        modal.style.position = 'fixed';
        modal.style.zIndex = '1000';
        modal.style.left = '0';
        modal.style.top = '0';
        modal.style.width = '100%';
        modal.style.height = '100%';
        modal.style.overflow = 'auto';
        modal.style.backgroundColor = 'rgba(0,0,0,0.4)';
        modal.style.display = 'flex';
        modal.style.alignItems = 'center';
        modal.style.justifyContent = 'center';

        const content = document.createElement('div');
        content.style.backgroundColor = '#fefefe';
        content.style.padding = '20px';
        content.style.border = '1px solid #888';
        content.style.width = '80%';
        content.style.maxWidth = '500px';
        content.style.borderRadius = '8px';
        content.style.boxShadow = '0 4px 8px rgba(0, 0, 0, 0.1)';

        content.innerHTML = `
          <h2>Update Inventory</h2>
          <p>Select a product to update inventory:</p>
          ${productSelectHtml}
          <div style="margin-bottom: 15px;">
            <label for="quantity-input" style="display: block; margin-bottom: 5px;">Quantity to ADD:</label>
            <input type="number" id="quantity-input" list="quantity-list" min="1" max="1200" style="width: 100%; padding: 8px;">
            <datalist id="quantity-list">
              ${Array.from({ length: 1200 }, (_, i) => i + 1).map(num => `<option value="${num}">`).join('')}
            </datalist>
            <small style="color: #666; display: block; margin-top: 5px;">This quantity will be ADDED to the existing inventory.</small>
          </div>
          <div style="margin-bottom: 15px;">
            <label for="location-input" style="display: block; margin-bottom: 5px;">Location:</label>
            <input type="text" id="location-input" value="Main Warehouse" style="width: 100%; padding: 8px;">
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 10px;">
            <button id="cancel-btn" style="padding: 8px 16px; border: none; border-radius: 4px; background-color: #f44336; color: white; cursor: pointer;">Cancel</button>
            <button id="submit-btn" style="padding: 8px 16px; border: none; border-radius: 4px; background-color: #4caf50; color: white; cursor: pointer;">Update</button>
          </div>
        `;

        modal.appendChild(content);
        document.body.appendChild(modal);

        // Cancel button
        document.getElementById('cancel-btn').addEventListener('click', () => {
          document.body.removeChild(modal);
        });

        // Submit button
        document.getElementById('submit-btn').addEventListener('click', async () => {
          const productId = document.getElementById('product-select').value;
          const quantityToAdd = parseInt(document.getElementById('quantity-input').value, 10);
          const location = document.getElementById('location-input').value;

          if (!productId) {
            alert('Please select a product');
            return;
          }

          // Find the selected product to get its current quantity
          const selectedProduct = products.find(p => p.id == productId);
          if (!selectedProduct) {
            alert('Product not found');
            return;
          }

          const currentQuantity = selectedProduct.quantity || 0;
          const newQuantity = currentQuantity + quantityToAdd;

          // Show confirmation with current and new quantities
          if (!confirm(`Are you sure you want to add ${quantityToAdd} units?\n\nCurrent quantity: ${currentQuantity}\nNew quantity will be: ${newQuantity}`)) {
            return; // User cancelled
          }

          document.body.removeChild(modal);

          try {
            // Update the inventory
            await window.api.updateInventory({
              productId: parseInt(productId),
              quantity: quantityToAdd,
              location,
              userId: user.id
            });

            // Reload the inventory data
            await loadInventory();

            // Show success message with quantity details
            alert(`Inventory updated successfully!\n\nPrevious quantity: ${currentQuantity}\nAdded: ${quantityToAdd}\nNew total: ${newQuantity}`);
          } catch (error) {
            console.error('Error updating inventory:', error);
            alert('Failed to update inventory. Please try again.');
          }
        });
      } catch (error) {
        console.error('Error preparing inventory update form:', error);
        alert('Failed to prepare inventory update form. Please try again.');
      }
    });

    // Upload products in bulk
    async function uploadProducts(file) {
      if (!file) {
        alert('Please select a file to upload.');
        return;
      }

      try {
        const text = await file.text();
        const rows = text.split('\n').map(row => row.split(','));

        rows.forEach(([code, name, size, category, rate, supply]) => {
          if (code && name && size && category && rate && supply) {
            inventory.push({
              code: code.trim(),
              name: name.trim(),
              size: size.trim(),
              category: category.trim(),
              price: parseFloat(rate.trim()),
              quantity: parseInt(supply.trim(), 10),
            });
          }
        });

        updateStockSummary();
        filterInventory();
        alert('Products uploaded successfully!');
      } catch (error) {
        console.error('Error uploading products:', error);
        alert('Error uploading products. Please check the file format.');
      }
    }

    // Add event listener for "Upload Products" input
    if (document.getElementById('upload-products')) {
      document.getElementById('upload-products').addEventListener('change', (event) => {
        const file = event.target.files[0];
        uploadProducts(file);
      });
    }

    // Initial load
    loadInventory();
  </script>
</body>

</html>
