<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Connection Error - Vendor Management</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .error-container {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 40px;
      text-align: center;
      max-width: 500px;
    }
    .error-icon {
      font-size: 64px;
      color: #dc3545;
      margin-bottom: 20px;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin: 0 10px;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-icon">⚠️</div>
    <h1>Database Connection Failed</h1>
    <p>
      The application cannot connect to the MongoDB database. Please ensure that:
    </p>
    <ul style="text-align: left; color: #666; margin-bottom: 30px;">
      <li>MongoDB server is running</li>
      <li>Database connection string is correct</li>
      <li>Network connectivity is available</li>
      <li>Firewall settings allow database connections</li>
    </ul>
    <div>
      <button class="btn btn-primary" onclick="retryConnection()">Retry Connection</button>
      <button class="btn btn-secondary" onclick="openSettings()">Check Settings</button>
    </div>
  </div>

  <script>
    function retryConnection() {
      // Reload the application to retry connection
      window.location.reload();
    }

    function openSettings() {
      // This would open database settings if implemented
      alert('Please check your MongoDB connection settings and ensure the database server is running.');
    }
  </script>
</body>
</html>
